# ── Peahen Calling: 键盘状态 BLE 广播(仅 central/左半装载) ──────────────────
# 以不可连接广播包持续外发:当前层/电量/WPM/修饰键/输出端点,主机被动扫描即可,
# 无需配对,不干扰分体 BLE 链路。右半(peripheral)由模块自动忽略,故只在本文件开启。
CONFIG_ZMK_BLE_ADV=y

# 层名字段(广播 payload 里的 layer_name,host 侧用于校验/显示)
CONFIG_ZMK_BLE_ADV_LAYER_NAMES=y

# Caps Lock 状态位(status_flags bit 3)
CONFIG_ZMK_HID_INDICATORS=y

# USB 连接/充电/首选输出状态位(bit 0/1/5)
CONFIG_ZMK_USB=y

# 转发右半电量为本地事件(模块的 battery_periph 字段依赖它;ZMK 默认关)
# 右半无需改固件:ZMK_BLE 默认 imply ZMK_BATTERY_REPORTING,外设侧本来就会报。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
