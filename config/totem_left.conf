# ── Peahen Calling: 键盘状态 BLE 广播(仅 central/左半装载) ──────────────────
# 以不可连接广播包持续外发:当前层/电量/WPM/修饰键/输出端点,主机被动扫描即可,
# 无需配对,不干扰分体 BLE 链路。右半(peripheral)由模块自动忽略,故只在本文件开启。
# 2026-09-02 拔线崩溃诊断:注释掉模块广播引擎做单一变量实验。
# 现象:USB 拔出瞬间/无 USB 冷启动 → 全静默硬崩(串口零报错、3V3 稳、按键无响应);
# 右半(同 v0.3 同板型,无 Peahen)纯电池运行一整天从不崩 → 模块自建广播集
# 与 ZMK 广播状态机在端点切换时的资源冲突为头号嫌疑。实验结论见 SKILL.md。
# CONFIG_ZMK_BLE_ADV=y

# 层名字段(广播 payload 里的 layer_name,host 侧用于校验/显示)
# CONFIG_ZMK_BLE_ADV_LAYER_NAMES=y

# Caps Lock 状态位(status_flags bit 3)
CONFIG_ZMK_HID_INDICATORS=y

# USB 连接/充电/首选输出状态位(bit 0/1/5)
CONFIG_ZMK_USB=y

# 拉取右半电量并产生 ZMK 事件(模块的 battery_periph 字段依赖;ZMK 默认关,
# 且 PROXY 子符号被它 gate 住——只开 PROXY 是空操作,md5 不变已验证)
# 右半无需改固件:ZMK_BLE 默认 imply ZMK_BATTERY_REPORTING,外设侧本来就会报。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
