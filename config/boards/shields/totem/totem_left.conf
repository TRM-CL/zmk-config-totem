# ── 电量诊断构建(分支 diagnostic/battery,临时)──────────────────────────
# 目的:把 zmk 电池链路的 DBG 日志从 USB 串口引出来。每 60s 一组:
#   zmk_battery_voltage_divider: ADC raw N ~ X mV => Y mV
#   zmk_battery_voltage_divider: Percent: P
# 另有 split central 行 "Battery level: %u" = 左半从右半 BAS 拉到的电量。
# 注:ZMK_LOG_LEVEL 默认即 4(DBG)且无 prompt,不可在 .conf 里赋值(Kconfig 会拒)。
CONFIG_ZMK_USB_LOGGING=y

# 与 zmk-usb-logging snippet 的 CDC 节点冲突(zmk#3031),诊断期间临时关闭
CONFIG_ZMK_STUDIO=n

# ── 零操作采集改造(仅诊断分支)──────────────────────────────────────────
# ZMK 默认空闲 30s 进入 IDLE 态,电池采样定时器破停(battery.c 只在 ACTIVE 跑)。
# 拉长到 24h:开机后无需任何按键,采样持续跑;插着 USB 时 activity.c 不会
# 系统关机(需 !is_usb_power_present),放电期电池上 15min 深睡行为不变。
CONFIG_ZMK_IDLE_TIMEOUT=86400000
# 采样密度翻倍(默认 60s,见 Kconfig.defaults:110),充电曲线更细
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
