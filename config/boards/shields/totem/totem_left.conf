# ── 拔线崩溃终审:无 USB 设备栈构建 ─────────────────────────────
# 前情:零 CDC 构建仍拔线死 → CDC 断开路径假说已死。本构建把 USB 设备栈
# 整个关掉(CONFIG_ZMK_USB=n):无 USB HID、无 USB 事件、无 VBUS 状态机,
# 插线只剩充电(开关需 ON)。判据=插线时蓝牙连上→拔线→链路是否存活。
# 活 → USB 栈/事件路径定罪,纯蓝牙可用固件成立;
# 死 → 板级电源切换/芯片级 VBUS 门控实锤,换 XIAO 结案。
# ⚠️ UF2 引导不受影响,随时可刷回任何构建。
CONFIG_ZMK_USB=n
CONFIG_ZMK_STUDIO=n

# 灯语诊断(仅左半):2闪=内核/5闪=应用/慢心跳=主循环活着
CONFIG_TOTEM_LIGHTHOUSE=y
