CONFIG_ZMK_USB_LOGGING=n

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_POINTING=y

# ── 空闲深度休眠(对两半都生效,base 名 totem.conf 会被左/右 build 同时引用) ──
# 空闲超时后整机断电(System OFF),按任意键唤醒:冷启动 + BLE 重连约 1-2s,
# 唤醒的那一次按键可能不会发给主机。休眠期间 Peahen 广播自然停止,仪表盘
# KeymapTab >90s 无更新自动变暗,无需改动。夜间/长时间离开不再白耗电。
CONFIG_ZMK_SLEEP=y
# 默认 900000ms(15 分钟);想更省电可改小,如 300000(5 分钟)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000