CONFIG_ZMK_USB_LOGGING=n

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_POINTING=y

# ── 空闲深度休眠：2026-08-23 起禁用，全链路见 SKILL.md 场景5 ──
# 病灶：插线期间空闲计时器照跑，System OFF 仅被 !is_usb_power_present()
# 压住 → 长时间插线挂机后一拔线条件立即满足 → 瞬间睡死；且 v0.3 的
# System OFF 按键唤醒在这套板上不工作 → 拔线=假砖，只有插回 USB 才能复活。
# 睡死时 3V3 轨仍有电，万用表无法与“在运行”区分（带载判决法见场景5）。
# 代价：闲置静息耗电恢复（约 30μA vs 0），长时间存放建议用板载开关断电。
# 若未来升级 ZMK 验证唤醒可靠，恢复下面两行即可。
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000